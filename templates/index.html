<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cube Engine Visualizer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d0f12; color: #f4f5f7; }
    main { width: min(1120px, 100%); margin: auto; padding: 24px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 650; }
    #status { color: #a7adb7; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; margin-top: 18px; }
    .stage, .panel { background: #15181d; border: 1px solid #282d35; border-radius: 16px; }
    .stage { position: relative; min-height: 610px; overflow: hidden; }
    #canvas { position: absolute; inset: 0; }
    #canvas canvas { display: block; }
    .hint { position: absolute; left: 16px; bottom: 14px; color: #a7adb7; pointer-events: none; }
    .panel { padding: 16px; }
    h2 { margin: 0 0 10px; font-size: 1rem; }
    .moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    button { min-height: 40px; border: 1px solid #343a45; border-radius: 9px; background: #20242b; color: #f4f5f7; font: inherit; cursor: pointer; }
    button:hover { background: #292e37; }
    button:disabled { cursor: wait; opacity: .5; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { flex: 1; }
    pre { overflow-wrap: anywhere; white-space: pre-wrap; margin: 10px 0 0; padding: 12px; background: #0f1115; border-radius: 10px; color: #b9e7ff; font-size: 12px; line-height: 1.5; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; color: #a7adb7; font-size: 12px; margin-top: 14px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
    @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } .stage { min-height: 470px; } }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
<main>
  <header><h1>Rahbe's Cube Engine</h1><div id="status" aria-live="polite">Loading Python state…</div></header>
  <div class="layout">
    <section class="stage" aria-label="Interactive three-dimensional Rubik's cube">
      <div id="canvas"></div>
    </section>
    <aside class="panel">
      <h2>Moves</h2>
      <div class="moves" id="moves"></div>
      <div class="actions"><button id="scramble">Scramble</button><button id="reset">Reset</button></div>
      <h2 style="margin-top:18px">Python CubeState</h2>
      <pre id="state">Waiting…</pre>
      <div class="legend">
        <span><i class="dot" style="background:#1976d2"></i>U blue</span>
        <span><i class="dot" style="background:#2eaa59"></i>D green</span>
        <span><i class="dot" style="background:#f5f5f5"></i>F white</span>
        <span><i class="dot" style="background:#f4c430"></i>B yellow</span>
        <span><i class="dot" style="background:#e53935"></i>R red</span>
        <span><i class="dot" style="background:#ff8c32"></i>L orange</span>
      </div>
    </aside>
  </div>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const mount = document.getElementById('canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(7, 6, 8);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.target.set(0, 0, 0);
controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;
camera.lookAt(controls.target);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3140, 2.4));
const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(5, 8, 7);
scene.add(keyLight);

const faceColors = {
  px: 0xe53935, nx: 0xff8c32,
  py: 0x1976d2, ny: 0x2eaa59,
  pz: 0xf5f5f5, nz: 0xf4c430,
  inner: 0x151515
};
const cubelets = [];
const spacing = 1.04;

function materialsFor(x, y, z) {
  return [
    new THREE.MeshStandardMaterial({color: x === 1 ? faceColors.px : faceColors.inner, roughness:.42}),
    new THREE.MeshStandardMaterial({color: x === -1 ? faceColors.nx : faceColors.inner, roughness:.42}),
    new THREE.MeshStandardMaterial({color: y === 1 ? faceColors.py : faceColors.inner, roughness:.42}),
    new THREE.MeshStandardMaterial({color: y === -1 ? faceColors.ny : faceColors.inner, roughness:.42}),
    new THREE.MeshStandardMaterial({color: z === 1 ? faceColors.pz : faceColors.inner, roughness:.42}),
    new THREE.MeshStandardMaterial({color: z === -1 ? faceColors.nz : faceColors.inner, roughness:.42})
  ];
}

function buildCube() {
  for (const cubelet of cubelets) scene.remove(cubelet);
  cubelets.length = 0;
  const geometry = new THREE.BoxGeometry(.96, .96, .96);
  for (let x=-1; x<=1; x++) for (let y=-1; y<=1; y++) for (let z=-1; z<=1; z++) {
    if (x === 0 && y === 0 && z === 0) continue;
    const cubelet = new THREE.Mesh(geometry, materialsFor(x,y,z));
    cubelet.position.set(x*spacing, y*spacing, z*spacing);
    cubelet.userData.grid = new THREE.Vector3(x,y,z);
    scene.add(cubelet);
    cubelets.push(cubelet);
  }
}
buildCube();

const configs = {
  U:{axis:'y',layer:1,sign:-1}, D:{axis:'y',layer:-1,sign:1},
  F:{axis:'z',layer:1,sign:-1}, B:{axis:'z',layer:-1,sign:1},
  R:{axis:'x',layer:1,sign:-1}, L:{axis:'x',layer:-1,sign:1}
};
let busy = false;
const allButtons = [];

function setBusy(value) {
  busy = value;
  allButtons.forEach(button => button.disabled = value);
}

function animateMove(move) {
  return new Promise(resolve => {
    const cfg = configs[move[0]];
    const suffix = move.slice(1);
    const quarterTurns = suffix === '2' ? 2 : suffix === "'" ? -1 : 1;
    const target = cfg.sign * quarterTurns * Math.PI / 2;
    const selected = cubelets.filter(c => Math.round(c.userData.grid[cfg.axis]) === cfg.layer);
    const pivot = new THREE.Group();
    scene.add(pivot);
    selected.forEach(c => pivot.attach(c));
    const start = performance.now();
    const duration = suffix === '2' ? 320 : 230;
    function frame(now) {
      const t = Math.min((now-start)/duration, 1);
      const eased = 1-Math.pow(1-t,3);
      pivot.rotation[cfg.axis] = target * eased;
      if (t < 1) return requestAnimationFrame(frame);
      pivot.rotation[cfg.axis] = target;
      pivot.updateMatrixWorld(true);
      selected.forEach(c => {
        scene.attach(c);
        c.position.set(
          Math.round(c.position.x/spacing)*spacing,
          Math.round(c.position.y/spacing)*spacing,
          Math.round(c.position.z/spacing)*spacing
        );
        c.userData.grid.set(
          Math.round(c.position.x/spacing),
          Math.round(c.position.y/spacing),
          Math.round(c.position.z/spacing)
        );
      });
      scene.remove(pivot);
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

function showState(data) {
  document.getElementById('status').textContent = data.solved ? 'Solved' : data.valid ? 'Valid state' : 'Invalid state';
  document.getElementById('state').textContent = [
    `corner_permutation = [${data.corner_permutation.join(', ')}]`,
    `corner_orientation = [${data.corner_orientation.join(', ')}]`,
    `edge_permutation = [${data.edge_permutation.join(', ')}]`,
    `edge_orientation = [${data.edge_orientation.join(', ')}]`
  ].join('\n');
}

async function sendMove(move) {
  if (busy) return;
  setBusy(true);
  try {
    const response = await fetch('/api/move', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({move})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Move failed');
    await animateMove(move);
    showState(data);
  } catch (error) {
    document.getElementById('status').textContent = error.message;
  } finally { setBusy(false); }
}

const notation = ['U','U2',"U'",'D','D2',"D'",'F','F2',"F'",'B','B2',"B'",'R','R2',"R'",'L','L2',"L'"];
const moveContainer = document.getElementById('moves');
notation.forEach(move => {
  const button = document.createElement('button');
  button.textContent = move;
  button.addEventListener('click', () => sendMove(move));
  moveContainer.appendChild(button);
  allButtons.push(button);
});

document.getElementById('reset').addEventListener('click', async () => {
  if (busy) return;
  setBusy(true);
  const response = await fetch('/api/reset', {method:'POST'});
  showState(await response.json());
  buildCube();
  setBusy(false);
});

document.getElementById('scramble').addEventListener('click', async () => {
  if (busy) return;
  const faces = ['U','D','F','B','R','L'];
  const suffixes = ['', '2', "'"];
  let previous = '';
  const moves = [];
  while (moves.length < 20) {
    const face = faces[Math.floor(Math.random()*faces.length)];
    if (face === previous) continue;
    previous = face;
    moves.push(face + suffixes[Math.floor(Math.random()*suffixes.length)]);
  }
  for (const move of moves) await sendMove(move);
});

function resize() {
  const width = mount.clientWidth;
  const height = mount.clientHeight;
  renderer.setSize(width, height);
  camera.aspect = width/height;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(mount);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene,camera); });
fetch('/api/reset', {method:'POST'}).then(r => r.json()).then(showState);
</script>
</body>
</html>
